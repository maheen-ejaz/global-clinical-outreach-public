<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="30" y="40" font-size="18" font-weight="700" fill="#16213a">What we are building</text><text x="30" y="62" font-size="13" fill="#4a5470">A research pipeline that turns provider websites into a ready-to-email prospect list for the GooCampusWorld team</text><rect x="30" y="95" width="176" height="135" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><text x="118.0" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#16213a">Providers</text><text x="118.0" y="151" text-anchor="middle" font-size="12.5" fill="#4a5470">hospitals, universities,</text><text x="118.0" y="170" text-anchor="middle" font-size="12.5" fill="#4a5470">fellowships, placement</text><text x="118.0" y="189" text-anchor="middle" font-size="12.5" fill="#4a5470">companies, any country</text><line x1="208" y1="162" x2="226" y2="162" stroke="#2f5bd3" stroke-width="2"/><path d="M225,156 L234,162 L225,168 Z" fill="#2f5bd3"/><rect x="236" y="95" width="176" height="135" rx="12" fill="#eaf0ff" stroke="#2f5bd3" stroke-width="1.5"/><rect x="236" y="95" width="176" height="6" rx="3" fill="#2f5bd3"/><text x="324.0" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#16213a">Research pipeline</text><text x="324.0" y="151" text-anchor="middle" font-size="12.5" fill="#4a5470">finds, screens and reads</text><text x="324.0" y="170" text-anchor="middle" font-size="12.5" fill="#4a5470">provider sites; extracts</text><text x="324.0" y="189" text-anchor="middle" font-size="12.5" fill="#4a5470">programmes and contacts</text><line x1="414" y1="162" x2="432" y2="162" stroke="#2f5bd3" stroke-width="2"/><path d="M431,156 L440,162 L431,168 Z" fill="#2f5bd3"/><rect x="442" y="95" width="176" height="135" rx="12" fill="#eaf0ff" stroke="#2f5bd3" stroke-width="1.5"/><rect x="442" y="95" width="176" height="6" rx="3" fill="#2f5bd3"/><text x="530.0" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#16213a">Prospect database</text><text x="530.0" y="151" text-anchor="middle" font-size="12.5" fill="#4a5470">organisations, programmes,</text><text x="530.0" y="170" text-anchor="middle" font-size="12.5" fill="#4a5470">people, checked emails,</text><text x="530.0" y="189" text-anchor="middle" font-size="12.5" fill="#4a5470">source page for every fact</text><line x1="620" y1="162" x2="638" y2="162" stroke="#2f5bd3" stroke-width="2"/><path d="M637,156 L646,162 L637,168 Z" fill="#2f5bd3"/><rect x="648" y="95" width="176" height="135" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><text x="736.0" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#16213a">Outreach team</text><text x="736.0" y="151" text-anchor="middle" font-size="12.5" fill="#4a5470">ranked shortlist and</text><text x="736.0" y="170" text-anchor="middle" font-size="12.5" fill="#4a5470">personalised emails,</text><text x="736.0" y="189" text-anchor="middle" font-size="12.5" fill="#4a5470">sent by hand</text><line x1="826" y1="162" x2="844" y2="162" stroke="#2f5bd3" stroke-width="2"/><path d="M843,156 L852,162 L843,168 Z" fill="#2f5bd3"/><rect x="854" y="95" width="176" height="135" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><text x="942.0" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#16213a">GooCampusWorld</text><text x="942.0" y="151" text-anchor="middle" font-size="12.5" fill="#4a5470">programmes listed for</text><text x="942.0" y="170" text-anchor="middle" font-size="12.5" fill="#4a5470">international medical</text><text x="942.0" y="189" text-anchor="middle" font-size="12.5" fill="#4a5470">graduates (IMGs)</text><rect x="236" y="250" width="382" height="26" rx="6" fill="#eaf0ff"/><text x="427" y="268" text-anchor="middle" font-size="12.5" fill="#2f5bd3" font-weight="600">this repository</text><text x="1030" y="268" text-anchor="end" font-size="12" fill="#4a5470">Nothing in this repository sends email.</text></svg>