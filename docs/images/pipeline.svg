<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="330" viewBox="0 0 1140 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="30" y="40" font-size="18" font-weight="700" fill="#16213a">How a batch runs</text><text x="30" y="62" font-size="13" fill="#4a5470">One batch = one country (us-02, gb-01 ...). Each step is resumable and logged in pipeline_runs.</text><rect x="30" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="30" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="100.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">1 Discover</text><text x="100.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">outreach discover</text><text x="100.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">curated IMG lists first,</text><text x="100.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">web search last</text><line x1="171" y1="170" x2="177" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M176,164 L185,170 L176,176 Z" fill="#2f5bd3"/><rect x="186" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="186" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="256.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">2 Screen</text><text x="256.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">one page per lead</text><text x="256.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">takes IMGs? still open?</text><text x="256.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">contact allowed? right country?</text><line x1="327" y1="170" x2="333" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M332,164 L341,170 L332,176 Z" fill="#2f5bd3"/><rect x="342" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="342" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="412.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">3 Read sites</text><text x="412.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">outreach scrape</text><text x="412.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">about 8 pages per site,</text><text x="412.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">cached for re-use</text><line x1="483" y1="170" x2="489" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M488,164 L497,170 L488,176 Z" fill="#2f5bd3"/><rect x="498" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="498" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="568.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">4 Extract</text><text x="568.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">AI agent + load</text><text x="568.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">programmes, fees, dates,</text><text x="568.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">people, emails, sources</text><line x1="639" y1="170" x2="645" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M644,164 L653,170 L644,176 Z" fill="#2f5bd3"/><rect x="654" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="654" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="724.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">5 Find contacts</text><text x="724.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">staff-page search</text><text x="724.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">named coordinators</text><text x="724.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">and decision-makers</text><line x1="795" y1="170" x2="801" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M800,164 L809,170 L800,176 Z" fill="#2f5bd3"/><rect x="810" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="810" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="880.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">6 Check emails</text><text x="880.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">outreach emails</text><text x="880.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">published, then guessed</text><text x="880.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">from the domain pattern</text><line x1="951" y1="170" x2="957" y2="170" stroke="#2f5bd3" stroke-width="2"/><path d="M956,164 L965,170 L956,176 Z" fill="#2f5bd3"/><rect x="966" y="95" width="140" height="150" rx="12" fill="#f4f6fb" stroke="#c9d1e3" stroke-width="1.5"/><rect x="966" y="95" width="140" height="6" rx="3" fill="#2f5bd3"/><text x="1036.0" y="129" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16213a">7 Rank</text><text x="1036.0" y="153" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#2f5bd3">outreach shortlist</text><text x="1036.0" y="185" text-anchor="middle" font-size="12" fill="#4a5470">targeting profiles decide</text><text x="1036.0" y="203" text-anchor="middle" font-size="12" fill="#4a5470">who is ready to email</text><text x="30" y="285" font-size="12.5" fill="#4a5470">Fails the screen or on the exclusion list → never scraped.  Unknown facts stay empty: nothing is guessed except email patterns, and those must pass the check.</text><text x="30" y="306" font-size="12.5" fill="#4a5470">Output: dashboards per batch, a combined report, and a ranked CSV per targeting profile (data/reports/, kept on the team Mac).</text></svg>