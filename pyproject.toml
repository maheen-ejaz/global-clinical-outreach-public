[project]
name = "global-clinical-outreach"
version = "0.1.0"
description = "Prospect research pipeline for clinical observership, elective and fellowship providers worldwide"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "jsonschema>=4.23"]

[project.scripts]
outreach = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
