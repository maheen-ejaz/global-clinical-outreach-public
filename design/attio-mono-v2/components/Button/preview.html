<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button · Attio Mono v2</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap">
<style>body { margin:0; } main { padding-block:var(--space-6); } section { margin-block:var(--space-6); } h1,h2,h3 { margin-top:0; } .specimens { display:flex; flex-wrap:wrap; gap:var(--space-4); } .specimen { display:grid; align-content:start; justify-items:start; gap:var(--space-2); } .specimen small { color:var(--muted); } .field-grid { max-width:760px; } .sample-panel { max-width:320px; } summary { cursor:pointer; } .theme-tools { display:flex; flex-wrap:wrap; gap:var(--space-2); margin-bottom:var(--space-6); } .guide-links { display:flex; flex-wrap:wrap; gap:var(--space-3); } .guide-links a { color:var(--ink); } .demo-dropdown { margin-top:var(--space-3); } .demo-dropdown summary { padding:var(--space-3); } .demo-dropdown .am-floating { margin-top:var(--space-2); } </style></head><body>
<main class="am-container"><nav class="theme-tools" aria-label="Preview theme"><button class="am-button am-button--secondary" type="button" data-set-theme="light" aria-pressed="false">Light</button><button class="am-button am-button--secondary" type="button" data-set-theme="dark" aria-pressed="false">Dark</button><button class="am-button am-button--secondary" type="button" data-set-theme="system" aria-pressed="true">System</button></nav>
<h1 class="display-lg am-responsive">Button</h1><p class="body-sm">Hover, press or tab to a live button. The labelled specimens also show each state without interaction.</p><section><h3 class="subhead">Monochrome primary</h3><div class="specimens"><div class="specimen"><small class="caption">Default</small><button type="button" class="am-button am-button--primary">Save profile</button></div><div class="specimen"><small class="caption">Hover</small><button type="button" class="am-button am-button--primary" data-preview-state="hover">Save profile</button></div><div class="specimen"><small class="caption">Focus</small><button type="button" class="am-button am-button--primary" data-preview-state="focus">Save profile</button></div><div class="specimen"><small class="caption">Active</small><button type="button" class="am-button am-button--primary" data-preview-state="active">Save profile</button></div><div class="specimen"><small class="caption">Disabled</small><button type="button" class="am-button am-button--primary" disabled>Save profile</button></div></div></section><section><h3 class="subhead">Outline secondary</h3><div class="specimens"><div class="specimen"><small class="caption">Default</small><button type="button" class="am-button am-button--secondary">Save profile</button></div><div class="specimen"><small class="caption">Hover</small><button type="button" class="am-button am-button--secondary" data-preview-state="hover">Save profile</button></div><div class="specimen"><small class="caption">Focus</small><button type="button" class="am-button am-button--secondary" data-preview-state="focus">Save profile</button></div><div class="specimen"><small class="caption">Active</small><button type="button" class="am-button am-button--secondary" data-preview-state="active">Save profile</button></div><div class="specimen"><small class="caption">Disabled</small><button type="button" class="am-button am-button--secondary" disabled>Save profile</button></div></div></section><section><h3 class="subhead">Accent primary</h3><div class="specimens"><div class="specimen"><small class="caption">Default</small><button type="button" class="am-button am-button--accent">Save profile</button></div><div class="specimen"><small class="caption">Hover</small><button type="button" class="am-button am-button--accent" data-preview-state="hover">Save profile</button></div><div class="specimen"><small class="caption">Focus</small><button type="button" class="am-button am-button--accent" data-preview-state="focus">Save profile</button></div><div class="specimen"><small class="caption">Active</small><button type="button" class="am-button am-button--accent" data-preview-state="active">Save profile</button></div><div class="specimen"><small class="caption">Disabled</small><button type="button" class="am-button am-button--accent" disabled>Save profile</button></div></div></section></main>
<script>document.querySelectorAll('[data-set-theme]').forEach(button => button.addEventListener('click', () => { const theme = button.dataset.setTheme; if (theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; document.querySelectorAll('[data-set-theme]').forEach(item => item.setAttribute('aria-pressed', String(item === button))); }));</script>
</body></html>
